services:
  parser-worker:
    environment:
      # Пагинация идёт по ДВУМ полосам: мобильный gost (основная) + резидентский пул.
      # Замер 20.08: пул a-poster упёрся в лимит потоков аккаунта (16 воркеров = 3-5%
      # отказов, +12 параллельных сверху = 29%), а gost держал 48 параллельных запросов
      # с нулём лимитов. Прямое с сервера мертво — FB отдаёт 1675004 на каждый запрос.
      PROXY_MODE: hybrid
      HYBRID_GOST_SHARE: "0.85"
      # Общий пул токен-сессий в Redis вместо запуска браузера на каждый срез
      # (было ~50 с из 190 с на срез). Проверено: одна сессия обслуживает любой
      # ключ/гео/статус — параметры запроса лежат в GraphQL-переменных, не в токенах.
      TOKEN_POOL_ENABLED: "true"
      TOKEN_POOL_SIZE: "6"
      TOKEN_POOL_TTL_SEC: "900"
    deploy:
      # Пул a-poster держал максимум ~16 одновременных запросов, поэтому воркеров было 16.
      # Мобильная полоса этот потолок сняла: замер 20.08 — 34 воркера дали 586 срезов/час
      # против 209 на 16 (нагрузка 3.0 из 12 ядер, 8 ГБ из 15). 32 — с запасом по памяти.
      replicas: 32
      resources:
        limits:
          # Было 6 ГБ под короткоживущий Chromium на каждый срез. С общим пулом токенов
          # браузер запускается раз в 15 минут на слот, воркеру хватает 2.5 ГБ — и при
          # росте числа реплик потолок держит машину.
          memory: 2560m
  postgres:
    # /dev/shm по умолчанию 64 МБ — параллельным запросам на таблице в 27 ГБ этого
    # не хватает, они падают с DiskFullError (could not resize shared memory segment).
    shm_size: 1gb
