# Shared log rotation — a runaway parser log once filled the disk.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: spy_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback-only: Postgres must never be reachable from the public internet. Host tooling
    # (psql, backups) reaches it via 127.0.0.1:5432; containers use the `postgres` DNS name.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  spy_redis:
    image: redis:7-alpine
    container_name: spy_redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gost:
    image: ginuerzh/gost:latest
    container_name: spy_gost
    restart: unless-stopped
    logging: *default-logging
    command: >
      -L=http://:8888
      -F=${PROXY_TYPE}://${PROXY_USER}:${PROXY_PASS}@${PROXY_HOST}:${PROXY_PORT}
    # Loopback-only: this is an OPEN http proxy (no auth). Published on 0.0.0.0 it was found
    # by scanners and abused as a free relay through the paid fxdx upstream (FTP/Winbox scans,
    # random sites) — burning the traffic cap and getting the exit-IP flagged. The parser
    # never needs a host port: it reaches the proxy via the internal `gost:8888` DNS name.
    # Kept published on loopback only for local debugging (curl -x http://127.0.0.1:8888).
    ports:
      - "127.0.0.1:8888:8888"

  # Coordinator + discovery poll loop: watches ParserRun(triggered), fans out RQ chunk
  # jobs, monitors them to completion. No heavy pagination here → modest memory.
  parser:
    build:
      context: ./parser
      dockerfile: Dockerfile
    container_name: spy_parser
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      PROXY_HTTP_GATEWAY: http://gost:8888
      REDIS_URL: ${REDIS_URL:-redis://spy_redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      spy_redis:
        condition: service_started
      gost:
        condition: service_started
    volumes:
      - ./parser:/app
    command: ["python", "-m", "app.main"]
    ulimits:
      core: 0          # Chromium was dumping multi-GB cores on crash
    deploy:
      resources:
        limits:
          memory: 512m

  # Scalable pagination workers — pull chunk jobs off the "parse" queue.
  # Browser-less pagination (curl_cffi) keeps each worker light (~200-400 MB);
  # a short-lived Chromium only appears during token capture / browser fallback.
  parser-worker:
    build:
      context: ./parser
      dockerfile: Dockerfile
    # always: come back after OOM/crash even if someone stopped the stack briefly
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      PROXY_HTTP_GATEWAY: http://gost:8888
      REDIS_URL: ${REDIS_URL:-redis://spy_redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      spy_redis:
        condition: service_started
      gost:
        condition: service_started
    volumes:
      - ./parser:/app
    # Inner loop restarts RQ on process crash; Docker restart: covers container death.
    command: ["sh", "/app/rq_watchdog.sh", "parse"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 \"$$(cat /tmp/rq-worker.pid)\" 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ulimits:
      core: 0
    deploy:
      replicas: ${PARSER_WORKERS:-4}
      resources:
        limits:
          memory: 700m

  # Media workers — download + phash-dedup + S3, off the "media" queue. Video is skipped
  # on the first pass (SKIP_VIDEO_FIRST_PASS) to respect the server's transfer cap.
  media-worker:
    build:
      context: ./parser
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      PROXY_HTTP_GATEWAY: http://gost:8888
      REDIS_URL: ${REDIS_URL:-redis://spy_redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      spy_redis:
        condition: service_started
      gost:
        condition: service_started
    volumes:
      - ./parser:/app
    command: ["sh", "/app/rq_watchdog.sh", "media"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 \"$$(cat /tmp/rq-worker.pid)\" 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ulimits:
      core: 0
    deploy:
      replicas: ${MEDIA_WORKERS:-2}
      resources:
        limits:
          memory: 512m

  refresh:
    build:
      context: ./parser
      dockerfile: Dockerfile
    container_name: spy_refresh
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      PROXY_HTTP_GATEWAY: http://gost:8888
      REDIS_URL: ${REDIS_URL:-redis://spy_redis:6379/0}
      SHELL: /usr/bin/sh
    depends_on:
      postgres:
        condition: service_healthy
      gost:
        condition: service_started
    volumes:
      - ./parser:/app
    command: ["python", "-m", "app.scheduler"]
    ulimits:
      core: 0
    deploy:
      resources:
        limits:
          memory: 1g

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: spy_migrate
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db:/db
    # country-unique before sort_fields: a stale/broken sort_fields must not block the critical schema fix
    command: ["/bin/sh", "/db/migrations/run_all.sh"]
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: spy_api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./api:/app

volumes:
  postgres_data:
